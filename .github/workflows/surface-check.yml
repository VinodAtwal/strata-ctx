name: surface-check

on:
  push:
    branches: [main]
  pull_request:
  # J-6. The weekly drift sweep. Agent extension surfaces move on the vendor's
  # release schedule, not on ours, so a check that only ever runs on our pushes
  # answers "did we break it" and never "did they".
  #
  # Monday 04:23 UTC, deliberately off :00. GitHub queues every scheduled
  # workflow to the top of the hour, so the repository-wide `0 * * * *` crowd
  # all wakes at once; :23 is an arbitrary minute that cannot collide with that
  # default, and 04:23 UTC is late Sunday evening for the Americas -- where most
  # Actions capacity and most of this project's contributors are -- so the run
  # does not compete for runners or land in anyone's working day. Early in the
  # week on purpose: drift found on Monday has a full week of owner time in
  # front of it.
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

concurrency:
  # Scheduled runs are keyed separately from the branch runs on purpose. Under a
  # single key a `main` push and Monday's sweep would share a group, and with
  # cancel-in-progress the two would cancel each other -- a sweep could silently
  # delete a required gate, or a push could kill the weekly drift report. So the
  # key includes the event name, and a sweep is never cancelled at all: it is
  # cheap, it is the only run of its kind that week, and starting it twice in a
  # row is not a cost worth optimising.
  group: surface-check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  NODE_VERSION: '20.19'

jobs:
  # Lane 1. The gate itself. Runs the checker against the committed snapshot, then
  # proves the snapshot is still what the adapters derive, then runs the tests that
  # cover the comparison and the update path.
  surface:
    name: agent surface drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Every agent surface matches the snapshot
        run: node --import tsx packages/integrations/src/surface-check.ts
      - name: The snapshot is current, not merely passing
        run: |
          set -euo pipefail
          node --import tsx packages/integrations/src/surface-check.ts --update
          if ! git diff --quiet -- packages/integrations/surface-check.snapshot.json; then
            echo "::error file=packages/integrations/surface-check.snapshot.json::an adapter moved and the snapshot was not refreshed. Confirm the change was intended, then commit the refreshed snapshot."
            git --no-pager diff -- packages/integrations/surface-check.snapshot.json
            exit 1
          fi
      - name: Surface check tests
        run: node --import tsx --test packages/integrations/test/surface-check.test.ts

  # Lane 2. Proof the gate fails when it should. A gate that cannot fail is not a
  # gate, and the two ways it could quietly stop failing are both checked here:
  # a renamed event it must catch, and a pinned judgement it must refuse to
  # rewrite.
  selfcheck:
    name: surface check detects drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Rename a pinned hook event, expect a non-zero exit naming the agent
        run: |
          set -euo pipefail
          cp packages/integrations/surface-check.snapshot.json /tmp/surface-check.snapshot.json
          node -e "const fs=require('fs');const p='packages/integrations/surface-check.snapshot.json';const s=JSON.parse(fs.readFileSync(p,'utf8'));s.agents['claude-code'].hookEvents=s.agents['claude-code'].hookEvents.map(function(event){return event==='PostToolUse'?'PostToolUseRenamed':event;});fs.writeFileSync(p,JSON.stringify(s,null,2)+'\n');"
          if node --import tsx packages/integrations/src/surface-check.ts 2>/tmp/surface-drift.err; then
            echo "::error::surface check passed despite a renamed hook event"
            exit 1
          fi
          if ! grep -q 'claude-code' /tmp/surface-drift.err; then
            echo "::error::the finding did not name the agent it found"
            cat /tmp/surface-drift.err
            exit 1
          fi
          cat /tmp/surface-drift.err
          cp /tmp/surface-check.snapshot.json packages/integrations/surface-check.snapshot.json
      - name: A pinned judgement it cannot check, expect --update to refuse
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');const p='packages/integrations/surface-check.snapshot.json';const s=JSON.parse(fs.readFileSync(p,'utf8'));s.agents['claude-code'].declaredPayloadKeys=s.agents['claude-code'].declaredPayloadKeys.concat(['a_key_nobody_declared']).sort();fs.writeFileSync(p,JSON.stringify(s,null,2)+'\n');"
          if node --import tsx packages/integrations/src/surface-check.ts --update; then
            echo "::error::--update laundered a pinned assumption into a green build"
            exit 1
          fi
          cp /tmp/surface-check.snapshot.json packages/integrations/surface-check.snapshot.json
      - name: Surface is clean again after the revert
        run: |
          set -euo pipefail
          node --import tsx packages/integrations/src/surface-check.ts
          git diff --quiet
