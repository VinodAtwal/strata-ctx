name: release

# J-5. Publishing is the only irreversible thing in this repo, so the shape here
# is: refuse, then plan, then prove, then publish, then write it down.
#
#   gate     trust, plus every manifest invariant the publish depends on. No
#            build, no registry writes. If this is red nothing downstream ran.
#   verify   typecheck, lint, tests, contract, surface drift, and an audit of
#            the tarball each package would actually put on the registry.
#   publish  the plan `gate` computed, executed verbatim in dependency order.
#   notes    the GitHub release, assembled from CHANGELOG.md + docs/releases/.
#
# `gate` exists because the two most expensive failures here are both quiet: a
# tag that was never reviewed, and a train that publishes half a dependency
# graph. A gate that runs after the publish is not a gate.
on:
  push:
    tags:
      - 'v*'
  # Re-run of a train that is already cut. The tag still has to satisfy every
  # check below -- dispatch is a different way to ask, not a way around.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v0.1.0. Must be contained in the release branch.'
        required: true
        type: string

# Never cancel a release. A publish interrupted between two packages leaves the
# registry in a state nobody can re-derive, and the useful response is to
# publish the remainder by hand -- not to have the runner kill the current run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Default to nothing; each job asks for exactly what it needs. `publish` needs
# id-token and nothing else, because provenance is the only ambient authority a
# release involves and it should be the only one.
permissions:
  contents: read

env:
  NODE_VERSION: '20.19'
  REGISTRY_URL: 'https://registry.npmjs.org'
  # The protected branch a release tag must be reachable from. A workflow env
  # rather than a literal: moving the release branch is then a one-line
  # reviewable diff instead of seven of them.
  RELEASE_BRANCH: 'main'
  # github.ref_type tells the two triggers apart. On a tag push ref_name is the
  # tag; on dispatch it is a branch, so the input is the tag instead.
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}

jobs:
  # ---------------------------------------------------------------- the gate
  gate:
    name: release gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Full history: "is this tag on the release branch" is a reachability
    # question, and a shallow clone cannot answer it.
    outputs:
      version: ${{ steps.plan.outputs.version }}
      order: ${{ steps.plan.outputs.order }}
      train: ${{ steps.plan.outputs.train }}
      todo: ${{ steps.registry.outputs.todo }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. A fork has no secrets, so this looks redundant next to the token
      #    check below. It is not redundant: it names the actual reason in the
      #    log instead of failing three steps later with a complaint about a
      #    token that was never going to be there.
      - name: Refuse to run from a fork
        if: ${{ github.event.repository.fork }}
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "::error::This workflow is running in a fork ($REPOSITORY). A release is cut from '$RELEASE_BRANCH' of the upstream repository, never from a fork."
          exit 1

      - name: The tag must be reachable from the protected release branch
        run: |
          set -euo pipefail
          if [ -z "${TAG:-}" ]; then
            echo "::error::no tag to release. Tag a commit already on '$RELEASE_BRANCH' as v<major>.<minor>.<patch>, or pass the tag to workflow_dispatch."
            exit 1
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$TAG' is not a release tag. Expected v<major>.<minor>.<patch>[-prerelease]."
            exit 1
          fi
          # Fetch both refs explicitly instead of trusting the checkout refspec.
          # The question is "is this commit an ancestor of the release branch",
          # and that is only answerable if both are local.
          git fetch --no-tags --force origin "+refs/heads/*:refs/remotes/origin/*"
          git fetch --no-tags --force origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          if ! git merge-base --is-ancestor "refs/tags/${TAG}" "refs/remotes/origin/${RELEASE_BRANCH}"; then
            echo "::error::tag ${TAG} is not contained in origin/${RELEASE_BRANCH}."
            echo "::error::A tag that is not on the protected release branch is not reviewed work. Put the commit on ${RELEASE_BRANCH}, re-tag, and delete the old tag."
            exit 1
          fi
          echo "::notice::${TAG} is contained in origin/${RELEASE_BRANCH}"

      # 2. The token gate. On an untrusted trigger `secrets.*` is not merely
      #    restricted, it is absent, so this is the backstop for anything that
      #    ever lets an untrusted trigger reach this job.
      - name: The publish token must be present and be an automation token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::error::secrets.NPM_TOKEN is empty or unset. A release needs an npm automation token (Account settings -> Access Tokens -> Automation) with publish scope."
            exit 1
          fi
          case "$NPM_TOKEN" in
            npm_*) ;;
            *)
              echo "::error::secrets.NPM_TOKEN does not look like an npm automation token (expected an 'npm_' prefix). A classic token cannot publish provenance-attested packages."
              exit 1
              ;;
          esac
          # Length and prefix, never the value. N4/R7: the same discipline the
          # gateway applies to auth headers applies to our own CI.
          echo "::notice::NPM_TOKEN present (${#NPM_TOKEN} chars, npm_ prefix) -- value not logged"

      # 3. Every manifest invariant the publish depends on, decided in one pure
      #    pass: no network, no build, no registry. The result is the plan, and
      #    `publish` executes that list rather than recomputing it -- one place
      #    decides the order, so there is nothing that can disagree later.
      - name: Plan the train
        id: plan
        run: |
          set -euo pipefail
          node --input-type=module - <<'PLAN'
          import { readdirSync, readFileSync, existsSync, appendFileSync } from 'node:fs';
          import path from 'node:path';

          const root = process.cwd();
          const out = (k, v) => appendFileSync(process.env.GITHUB_OUTPUT, `${k}=${v}\n`);
          // One annotation per line. A multi-line ::error:: shows only its first
          // line in the run summary, and the rest of the message is the part
          // that says what to do about it.
          const fail = (msg) => {
            for (const line of String(msg).split('\n')) {
              const t = line.trim();
              if (t !== '') console.log(`::error::${t.replace(/%/g, '%25').replace(/\r/g, '%0D')}`);
            }
            process.exit(1);
          };

          const tag = process.env.TAG;
          const m = /^v(\d+)\.(\d+)\.(\d+)(?:-[0-9A-Za-z.-]+)?$/.exec(tag);
          if (!m) fail(`'${tag}' is not v<major>.<minor>.<patch>[-prerelease].`);
          const version = `${m[1]}.${m[2]}.${m[3]}`;

          const FROZEN = '@strata-ctx/core-types';
          const SCOPE = '@strata-ctx/';

          const pkgs = new Map();
          for (const dir of readdirSync(path.join(root, 'packages')).sort()) {
            const file = path.join(root, 'packages', dir, 'package.json');
            if (!existsSync(file)) continue;
            const j = JSON.parse(readFileSync(file, 'utf8'));
            // `npm publish --workspace` resolves by directory, so a name that
            // disagrees with it publishes a different package than the one that
            // was reviewed.
            if (j.name !== SCOPE + dir) {
              fail(`packages/${dir} is named "${j.name}" but the directory says "${SCOPE}${dir}". Fix the name or the directory before tagging: publish resolves the workspace by directory.`);
            }
            pkgs.set(j.name, { dir, manifest: j });
          }
          if (pkgs.size === 0) fail('no packages found under packages/.');

          // Internal edges only. An @strata-ctx/* spec is either a version the
          // registry can honour or a defect; nothing else is our problem here.
          const internal = (j) =>
            Object.entries(j.dependencies ?? {}).filter(([n]) => n.startsWith(SCOPE));

          const train = [...pkgs.keys()].filter((n) => pkgs.get(n).manifest.private !== true).sort();
          const withheld = [...pkgs.keys()].filter((n) => pkgs.get(n).manifest.private === true).sort();

          if (train.length === 0) {
            fail('no package is publishable: every packages/*/package.json still has "private": true. A train with nothing in it is a tag that lies about what shipped.');
          }
          if (withheld.length > 0) {
            console.log(`::warning::not in this train ("private": true): ${withheld.join(', ')}`);
            console.log(`::warning::${withheld.length} of ${pkgs.size} packages will not be published. If that is not deliberate, set "private": false and re-tag.`);
          }

          // Kahn, tie-broken by name, so the order is a pure function of the
          // manifests: same tree in, same sequence out, on every machine and
          // every run. Iterating `train` directly would also be correct today
          // and silently wrong the day an edge is added.
          const inTrain = new Set(train);
          const indegree = new Map(train.map((n) => [n, 0]));
          const outgoing = new Map(train.map((n) => [n, []]));
          for (const n of train) {
            for (const [dep, range] of internal(pkgs.get(n).manifest)) {
              if (range.startsWith('file:')) {
                // npm publishes a `file:` spec verbatim, so consumers get a
                // manifest that only resolves inside this repository. Scoped to
                // train members on purpose: a package that is not being
                // published is not a release blocker, and a gate that fires on
                // unpublished manifests is a gate people learn to ignore.
                fail(`packages/${pkgs.get(n).dir}/package.json depends on ${dep} via "${range}". npm publishes that spec unchanged, so the result is a manifest no consumer can resolve. Pin it to a released range and republish.`);
              }
              if (!inTrain.has(dep)) continue;
              outgoing.get(dep).push(n);
              indegree.set(n, indegree.get(n) + 1);
            }
          }
          const order = [];
          const ready = train.filter((n) => indegree.get(n) === 0);
          while (ready.length > 0) {
            const n = ready.shift();
            order.push(n);
            for (const next of outgoing.get(n)) {
              indegree.set(next, indegree.get(next) - 1);
              if (indegree.get(next) === 0) ready.push(next);
            }
            ready.sort();
          }
          if (order.length !== train.length) {
            const stuck = train.filter((n) => !order.includes(n));
            fail(`these packages cannot be ordered, which means a dependency cycle among them: ${stuck.join(', ')}. A cycle has no correct publish order, and npm would resolve it to whichever half it happened to see first.`);
          }

          // The frozen contract is why the order matters: every other package
          // compiles against it, so it is first, or the rest of the train is
          // being published against a version the registry may not have yet.
          if (inTrain.has(FROZEN) && order[0] !== FROZEN) {
            fail(`the internal dependency sort put ${order[0]} ahead of ${FROZEN}. Every other package compiles against it, so the sorter is wrong.`);
          }

          // Version policy. A release train is one version, with exactly one
          // exception: core-types is semver-locked at its frozen version and
          // moves only with an explicit re-freeze, which is a conversation the
          // contract owner has to have (AGENTS.md section 1, risk R5).
          const lockPath = path.join(root, 'packages/core-types/contract.lock.json');
          if (!existsSync(lockPath)) fail('packages/core-types/contract.lock.json is missing. Run: npm run contract:update');
          const lock = JSON.parse(readFileSync(lockPath, 'utf8'));
          const mismatched = [];
          for (const n of train) {
            const v = pkgs.get(n).manifest.version;
            if (n === FROZEN) {
              if (v !== lock.frozenVersion) {
                fail(`${FROZEN} is at ${v} but contract.lock.json says it is frozen at ${lock.frozenVersion}. A frozen contract does not drift by accident: re-freeze deliberately with "npm run contract:update" in its own commit, or put the version back.`);
              }
            } else if (v !== version) {
              mismatched.push(`  ${n}: manifest says ${v}, tag says ${version}`);
            }
          }
          if (mismatched.length > 0) {
            fail(`package versions do not match the release tag v${version}:\n${mismatched.join('\n')}\nA train publishes one version. Bump the manifests, or tag what you actually built.`);
          }

          // An internal dependency outside the train is a package published
          // pointing at something no consumer can install. This is the failure
          // that makes a monorepo release quietly wrong: every publish succeeds,
          // every tarball is valid, and the graph is broken underneath.
          const orphans = [];
          for (const n of train) {
            for (const [dep, range] of internal(pkgs.get(n).manifest)) {
              if (inTrain.has(dep)) continue;
              orphans.push(
                pkgs.has(dep)
                  ? `  ${n}@${pkgs.get(n).manifest.version} needs ${dep}@${range}, and ${dep} is not in this train`
                  : `  ${n}@${pkgs.get(n).manifest.version} needs ${dep}@${range}, and no package with that name exists in this repository`,
              );
            }
          }
          if (orphans.length > 0) {
            fail(`publishing this train would break the dependency graph:\n${orphans.join('\n')}\nEvery internal dependency has to ship in the same train.`);
          }

          for (const n of order) console.log(`plan  ${n}@${pkgs.get(n).manifest.version}`);
          console.log(`plan  ${train.length} package(s), ${withheld.length} withheld, version ${version}`);

          out('version', version);
          // Space-separated, not JSON: the only consumer is a bash `for`, and
          // re-parsing an array in a second process to get a list the author
          // already had is a step where the two representations drift apart.
          // `train` stays JSON because its consumer is node.
          out('order', order.join(' '));
          out('train', JSON.stringify(train));
          PLAN

      # 4. Which of those versions the registry has not seen. Kept apart from
      #    the plan because it is the only step that talks to npm, and a reader
      #    should be able to see exactly where the network boundary sits.
      - name: Which versions are missing from the registry
        id: registry
        env:
          ORDER: ${{ steps.plan.outputs.order }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # Written to the runner's user config, not the repository: a .npmrc in
          # the working tree would show up in every later `git diff` in the job.
          npm config set registry "$REGISTRY_URL" >/dev/null
          npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN" >/dev/null

          TODO=""
          # Array from the space-separated list, rather than `for x in $ORDER`.
          # Unquoted expansion word-splits in bash but not in zsh, and a release
          # pipeline is the last place to find out which shell something runs in.
          read -r -a SPECS <<< "$ORDER"
          for name in "${SPECS[@]}"; do
            ver=$(node -p "require('./packages/${name#@strata-ctx/}/package.json').version")
            spec="${name}@${ver}"
            # "Not on the registry" and "the registry did not answer" are
            # different facts and only one of them means publish. Conflating them
            # turns a transient 503 into an attempted republish, which npm then
            # rejects with a confusing E403.
            probe=$(npm view "$spec" version 2>&1) && rc=0 || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "::notice::$spec is already on the registry -- it will not be republished"
            elif printf '%s' "$probe" | grep -q 'E404'; then
              echo "::notice::$spec will be published"
              TODO="${TODO}${TODO:+,}$spec"
            else
              echo "::error::could not determine whether $spec is published. The registry lookup failed:"
              printf '%s\n' "$probe"
              exit 1
            fi
          done
          if [ -z "$TODO" ]; then
            echo "::error::this train would publish nothing -- every package in it is already at this version on the registry. Cut a new tag with bumped versions, or delete this one."
            exit 1
          fi
          echo "todo=${TODO}" >> "$GITHUB_OUTPUT"

      - name: The release is documented
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          # A date in the heading is what stops a changelog entry from being a
          # promise. "## [0.1.0]" with no date is Unreleased wearing a version
          # number, and after the fact the two are indistinguishable.
          if ! grep -Eq "^## \[${VERSION}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no dated entry for ${VERSION}."
            echo "::error::Expected a heading exactly like: ## [${VERSION}] - $(date -u +%Y-%m-%d)"
            echo "::error::Rename the Unreleased section to the version being tagged and date it."
            exit 1
          fi
          NOTE="docs/releases/${VERSION}.md"
          if [ ! -f "$NOTE" ]; then
            echo "::error::${NOTE} does not exist."
            echo "::error::Copy docs/releases/TEMPLATE.md to ${NOTE} and fill it in. Every release has one, even when the answer is 'no migration required' -- that answer is the useful part."
            exit 1
          fi
          if ! grep -Eq '^## Migration' "$NOTE"; then
            echo "::error::${NOTE} has no '## Migration' section."
            echo "::error::A release note without one leaves readers diffing the changelog and guessing. Write 'None -- no interface changed.' if that is the answer."
            exit 1
          fi
          echo "::notice::CHANGELOG.md and ${NOTE} both cover ${VERSION}"

  # ------------------------------------------------------------------ verify
  verify:
    name: verify + audit the tarballs
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: ${{ env.REGISTRY_URL }}

      - run: npm ci

      # The same four lanes CI runs, in CI's order, plus the surface gate --
      # which matters more than usual in a release, because `integrations` is
      # the package that encodes third-party agent schemas, and a release is
      # precisely the moment those get pinned into other people's stacks.
      - name: typecheck
        run: npm run typecheck
      - name: lint
        run: npm run lint
      - name: tests
        run: npm run test
      - name: contract freeze
        run: npm run contract:check
      - name: agent surface drift
        run: node --import tsx packages/integrations/src/surface-check.ts

      # The tarball, not the repository, is the unit that gets installed. A
      # package with no "files" field ships its tests, its TypeScript sources
      # and its build metadata to every consumer, and it ships them silently:
      # the publish succeeds, the install succeeds, and the junk is simply there.
      - name: Audit what each package would actually publish
        env:
          TRAIN: ${{ needs.gate.outputs.train }}
        run: |
          set -euo pipefail
          node --input-type=module - <<'AUDIT'
          import { execFileSync } from 'node:child_process';
          import { readdirSync, readFileSync } from 'node:fs';
          import path from 'node:path';

          const root = process.cwd();
          const fail = (msg) => {
            for (const line of String(msg).split('\n')) {
              const t = line.trim();
              if (t !== '') console.log(`::error::${t.replace(/%/g, '%25').replace(/\r/g, '%0D')}`);
            }
            process.exit(1);
          };
          const train = JSON.parse(process.env.TRAIN);
          const dirs = readdirSync(path.join(root, 'packages'));
          const problems = [];

          for (const name of train) {
            const dir = dirs.find((d) => JSON.parse(readFileSync(path.join(root, 'packages', d, 'package.json'), 'utf8')).name === name);
            const stdout = execFileSync('npm', ['pack', '--dry-run', '--json', '--workspace', name], {
              cwd: root,
              encoding: 'utf8',
              stdio: ['ignore', 'pipe', 'inherit'],
            });
            // npm can interleave lifecycle output ahead of the JSON. Slice from
            // the array so a future prepack script cannot break the audit -- and
            // fail loudly rather than silently auditing nothing.
            const start = stdout.indexOf('[');
            if (start < 0) fail(`npm pack produced no JSON for ${name}:\n${stdout}`);
            const info = JSON.parse(stdout.slice(start))[0];
            const files = info.files.map((f) => f.path);
            const bytes = info.files.reduce((n, f) => n + f.size, 0);

            const junk = files.filter(
              (f) => /(^|\/)(test|tests|src)\//.test(f) || f.endsWith('.tsbuildinfo') || f.endsWith('.tgz'),
            );
            if (junk.length > 0) {
              problems.push(
                `${name} would publish source and test files: ${junk.slice(0, 4).join(', ')}${junk.length > 4 ? `, +${junk.length - 4} more` : ''}\n` +
                  `    fix: add "files": ["dist"] to packages/${dir}/package.json`,
              );
            }
            // Apache-2.0 section 4(a): the licence has to travel with the work.
            // npm copies LICENSE out of the *package* directory, and no package
            // has one, so every tarball would ship with no licence text at all.
            if (!files.some((f) => /^LICEN[CS]E(\.(md|txt))?$/i.test(f))) {
              problems.push(
                `${name} tarball carries no LICENSE.\n` +
                  `    fix: add "files": ["dist", "LICENSE", "README.md"] to packages/${dir}/package.json and make packages/${dir}/LICENSE ` +
                  `and packages/${dir}/README.md exist (a symlink to ../../LICENSE and ../../README.md is enough on a case-sensitive filesystem).`,
              );
            }
            console.log(`pack  ${name}@${info.version}  ${files.length} files  ${(bytes / 1024).toFixed(0)} KiB`);
          }
          if (problems.length > 0) fail(`the tarballs are not shippable:\n${problems.map((p) => `  - ${p}`).join('\n')}`);
          AUDIT

  # ----------------------------------------------------------------- publish
  publish:
    name: publish
    needs: [gate, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Provenance, and nothing else. The point of the exercise: a consumer can
    # verify that this tarball came from this commit in this repository, signed
    # by the runner, without trusting this project or this workflow file.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: ${{ env.REGISTRY_URL }}

      - run: npm ci

      # Rebuilt here rather than carried over from `verify` as an artifact. It
      # costs about forty seconds and buys the thing that matters: the tree
      # that gets published is built by the job that publishes it. No upload,
      # no download, and no window in which the tested bytes and the shipped
      # bytes are not obviously the same ones.
      - name: Build
        run: npm run build

      - name: Re-check the contract at publish time
        run: npm run contract:check

      - name: Publish in dependency order
        env:
          TODO: ${{ needs.gate.outputs.todo }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # `gate` already decided this list, in this order, from the manifests.
          # It is executed verbatim. Recomputing it here would be a second
          # implementation of the ordering rule, and the two would eventually
          # disagree on exactly the train that mattered.
          IFS=',' read -r -a SPECS <<< "$TODO"
          for spec in "${SPECS[@]}"; do
            name="${spec%@*}"
            version="${spec##*@}"

            # Re-read the registry rather than trusting the gate's answer. A
            # train re-run after a partial failure finds some of these already
            # published, and finding that out here -- loudly -- beats a
            # consumer discovering it from an install error.
            probe=$(npm view "$spec" version 2>&1) && rc=0 || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "::error::$spec is on the registry already, but the plan does not list it. The plan is stale -- re-run the release."
              exit 1
            fi
            if ! printf '%s' "$probe" | grep -q 'E404'; then
              echo "::error::could not determine whether $spec is published:"
              printf '%s\n' "$probe"
              exit 1
            fi

            echo "::group::publish $spec"
            npm publish --workspace "$name" --access public --provenance
            echo "::endgroup::"

            # Read back instead of trusting the exit code alone: exiting 0 is
            # not the same as arriving, and this is the only assertion that the
            # tarball reached the registry.
            arrived=$(npm view "$spec" version 2>/dev/null || true)
            if [ "$arrived" != "$version" ]; then
              echo "::error::$spec did not appear on the registry after publish (saw '${arrived:-nothing}'). Later packages in this train depend on it, so the train stops here."
              exit 1
            fi
            echo "::notice::$spec is on the registry"
          done

      - name: Summary
        env:
          TODO: ${{ needs.gate.outputs.todo }}
        run: |
          set -euo pipefail
          {
            echo "### Published"
            echo
            IFS=',' read -r -a SPECS <<< "$TODO"
            for spec in "${SPECS[@]}"; do
              echo "- ${spec}"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------- notes
  notes:
    name: GitHub release
    needs: [gate, verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The body is the changelog section for this version plus the migration
      # note in full, both read from the files the gate already validated -- so
      # the published release and the committed CHANGELOG cannot come to
      # describe different trains.
      - name: Assemble the release body
        id: body
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          node --input-type=module - <<'BODY'
          import { readFileSync, appendFileSync, existsSync } from 'node:fs';

          const version = process.env.VERSION;
          const fail = (msg) => { console.log(`::error::${msg}`); process.exit(1); };

          const changelog = readFileSync('CHANGELOG.md', 'utf8');
          // Everything between this version's heading and the next `## `. A
          // heading regex is enough here because the changelog's structure was
          // validated by the gate that ran a moment ago.
          const escaped = version.replace(/\./g, '\\.');
          const heading = new RegExp(`^## \\[${escaped}\\] - \\d{4}-\\d{2}-\\d{2}$`, 'm');
          const at = changelog.search(heading);
          if (at < 0) fail(`CHANGELOG.md has no dated entry for ${version}.`);
          const after = changelog.slice(at);
          const rest = after.slice(after.indexOf('\n') + 1);
          const next = rest.search(/^## /m);
          const section = (next < 0 ? rest : rest.slice(0, next)).trim();

          const notePath = `docs/releases/${version}.md`;
          if (!existsSync(notePath)) fail(`${notePath} does not exist.`);
          const note = readFileSync(notePath, 'utf8').trim();

          const body = [section, '', '---', '', '## Migration notes', '', note].join('\n');
          // Multi-line outputs need the delimiter form. `body=${body}` would be
          // truncated at the first newline by the runner's own output parser,
          // which is a spectacularly quiet way to publish a release with an
          // empty description.
          appendFileSync(process.env.GITHUB_OUTPUT, `body<<STRATA_RELEASE_BODY\n${body}\nSTRATA_RELEASE_BODY\n`);
          console.log(body);
          BODY

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.gate.outputs.version }}
          BODY: ${{ steps.body.outputs.body }}
        run: |
          set -euo pipefail
          # The preinstalled gh CLI rather than a third-party release action: one
          # less dependency in the only workflow that can publish code.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::notice::release $VERSION already exists -- updating it in place"
            gh release edit "$VERSION" --title "$VERSION" --notes "$BODY"
          else
            # --verify-tag: gh must find the tag in the repository, so it cannot
            # invent one pointing at whatever commit it happened to check out.
            gh release create "$VERSION" --title "$VERSION" --notes "$BODY" --verify-tag
          fi
